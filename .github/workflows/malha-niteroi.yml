# Gera data/niteroi-ruas.json (malha viária de Niterói do OpenStreetMap) para o mini Gêmeo.
# Roda sozinho quando o script muda na main e pode ser disparado pela aba Actions.
name: Malha viária de Niterói

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/malha-niteroi.mjs
      - .github/workflows/malha-niteroi.yml

permissions:
  contents: write

jobs:
  malha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Baixar a malha do OpenStreetMap
        run: node tools/malha-niteroi.mjs
      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/niteroi-ruas.json
          git diff --cached --quiet || git commit -m "Atualiza a malha viária de Niterói (OpenStreetMap)"
          git push
